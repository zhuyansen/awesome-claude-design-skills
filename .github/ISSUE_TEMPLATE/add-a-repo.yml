name: Add a repo
description: Suggest an open-source design skill or tool for coding agents
title: "Add: owner/repo"
labels: ["submission"]
body:
  - type: input
    id: url
    attributes:
      label: GitHub URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of tool is it?
      options:
        - UI & frontend style
        - Design systems
        - Figma & design tools
        - Design to code
        - Graphics & brand
        - Design review
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Anything the README does not say
      description: Optional. The review reads the README, so the best way to get listed is a README that shows it working.
